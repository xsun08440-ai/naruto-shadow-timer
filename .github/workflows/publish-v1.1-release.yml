name: Normalize v1.1 release asset names

on:
  push:
    branches: [main]
    paths:
      - README_EN.md

permissions:
  contents: write

jobs:
  rename-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload clear asset filenames
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp "替身计时器.apk" "naruto-shadow-timer.apk"
          cp "替身计时器.as" "shadow_timer.as"
          gh release upload v1.1 \
            "naruto-shadow-timer.apk" \
            "shadow_timer.as" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
          gh release delete-asset v1.1 default.apk --yes --repo "$GITHUB_REPOSITORY"
          gh release delete-asset v1.1 default.as --yes --repo "$GITHUB_REPOSITORY"
